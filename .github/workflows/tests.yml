name: Testes

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Instalar o Chromium
        run: npx playwright install --with-deps chromium

      # Garante que as bibliotecas auto-hospedadas não foram trocadas por engano.
      - name: Conferir integridade das bibliotecas em vendor/
        run: npm run checksums

      # Gera o PDF sintético (pretest) e roda a suíte completa.
      - name: Rodar a suíte
        run: npm test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
